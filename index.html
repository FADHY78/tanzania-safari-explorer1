<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Embuat Safaris - Explore • Experience • Preserve</title>
    <link rel="icon" type="image/jpeg" href="/embuat-safaris-logo.jpg" />
    
    <!-- Instant Dark Mode Init Script (Prevents Theme Flash) -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Tailwind CSS with Logo Brand Extensions & Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#C08240',
                amber: '#D48B28',
                orange: '#DE6826',
                ochre: '#B83226',
                dark: '#120F0D',
                cardDark: '#1B1613',
                borderDark: '#2C241E',
                cream: '#FAF7F2',
                sand: '#F2EBE1'
              }
            }
          }
        }
      };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
      }
      @media (min-width: 1024px) {
        body { font-size: 15px; }
      }
      @media (min-width: 1536px) {
        body { font-size: 16px; }
      }
      h1, h2, h3, h4, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .container {
        max-width: 1400px;
      }
      .safari-gradient {
        background: linear-gradient(135deg, #C08240 0%, #DE6826 100%);
      }
      .safari-accent {
        color: #C08240;
      }
      .safari-bg-accent {
        background-color: #C08240;
      }
      .safari-border-accent {
        border-color: #C08240;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Smooth Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .animate-slide-down {
        animation: slideDown 0.3s ease-out;
      }
      
      html {
        scroll-behavior: smooth;
      }

      /* Google Translate Seamless Integration - Clean UI without banners */
      .goog-te-banner-frame.skiptranslate, 
      .goog-te-banner-frame, 
      iframe.goog-te-banner-frame,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-ORHb-OEVmcd.skiptranslate,
      iframe[id=":1.container"],
      iframe[id*="container"] { 
        display: none !important; 
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      body { 
        top: 0px !important; 
        position: static !important;
      }
      .goog-te-gadget { 
        font-size: 0px !important;
        color: transparent !important;
      }
      .goog-tooltip, 
      #goog-gt-tt, 
      .goog-te-balloon-frame { 
        display: none !important; 
      }
      .goog-text-highlight { 
        background-color: transparent !important; 
        box-shadow: none !important; 
      }
      font[style] { 
        background-color: transparent !important; 
        box-shadow: none !important;
      }
      /* Ensure brand logo and slogans are never translated */
      .notranslate {
        translate: no;
      }
    </style>
    <link rel="stylesheet" href="/index.css">

    <!-- Google Website Translator Core -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,sw,fr,de,it,es',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </head>
  <body class="bg-[#FAF7F2] text-gray-800 dark:bg-[#120F0D] dark:text-[#E8E1D9] transition-colors duration-300 antialiased selection:bg-[#C08240] selection:text-white">
    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
