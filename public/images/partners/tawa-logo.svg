<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tawaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194D33"/>
      <stop offset="100%" stop-color="#0F2D1F"/>
    </linearGradient>
    <linearGradient id="tawaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
  </defs>

  <!-- Left: Official TAWA Crest -->
  <g transform="translate(10, 6)">
    <!-- Shield / Seal -->
    <path d="M55 4 C90 4, 102 20, 102 52 C102 85, 55 106, 55 106 C55 106, 8 85, 8 52 C8 20, 20 4, 55 4 Z" fill="url(#tawaGreen)" stroke="url(#tawaGold)" stroke-width="3"/>
    
    <!-- Inner gold circle -->
    <circle cx="55" cy="50" r="36" fill="#F4EDE1" stroke="#E5A93C" stroke-width="1.5"/>

    <!-- African Elephant & Buffalo heads (TAWA insignia) -->
    <g transform="translate(34, 28) scale(0.7)">
      <!-- Elephant Head -->
      <path d="M14 10 C8 10, 2 16, 2 26 C2 34, 8 36, 12 36 L12 50 C12 53, 16 53, 16 50 L16 36 C22 36, 28 32, 28 24 C28 14, 22 10, 14 10 Z" fill="#4A4E51"/>
      <!-- Tusks -->
      <path d="M10 34 Q6 42 1 44 Q4 42 10 38 Z" fill="#FFFFFF"/>
      <path d="M18 34 Q22 42 27 44 Q24 42 18 38 Z" fill="#FFFFFF"/>
      <!-- Cape Buffalo horn arc -->
      <path d="M30 18 C30 10, 42 6, 50 14 C46 16, 38 18, 38 24 Z" fill="#2B2D2F"/>
      <path d="M50 14 C58 6, 70 10, 70 18 C70 24, 62 16, 58 14 Z" fill="#2B2D2F"/>
    </g>

    <!-- TAWA Acronym Banner -->
    <rect x="22" y="80" width="66" height="17" rx="3" fill="#D48B28" stroke="#FFFFFF" stroke-width="1"/>
    <text x="55" y="93" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">TAWA</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(126, 16)">
    <text x="0" y="20" fill="#194D33" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" letter-spacing="1">TAWA TANZANIA</text>
    <text x="0" y="36" fill="#D48B28" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2">WILDLIFE MANAGEMENT AUTHORITY</text>
    
    <line x1="0" y1="45" x2="185" y2="45" stroke="#194D33" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="60" fill="#333333" font-family="Arial, sans-serif" font-size="9" font-weight="700">GAME RESERVES &amp; ECOSYSTEM CUSTODIAN</text>
    <text x="0" y="73" fill="#666666" font-family="Arial, sans-serif" font-size="8.5" font-weight="500">Ministry of Natural Resources &amp; Tourism</text>
    <text x="0" y="85" fill="#194D33" font-family="Arial, sans-serif" font-size="8.5" font-weight="700">Official Government Wildlife Authority</text>
  </g>
</svg>
