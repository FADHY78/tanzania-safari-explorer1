<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tawiriGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6B38"/>
      <stop offset="100%" stop-color="#124322"/>
    </linearGradient>
    <linearGradient id="tawiriBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5A8A"/>
      <stop offset="100%" stop-color="#07324F"/>
    </linearGradient>
  </defs>

  <!-- Left: Official TAWIRI Circular Seal -->
  <g transform="translate(10, 6)">
    <!-- Outer Seal Ring -->
    <circle cx="55" cy="55" r="51" fill="url(#tawiriGreen)" stroke="#C08240" stroke-width="3.5"/>
    <circle cx="55" cy="55" r="44" fill="#FFFFFF" stroke="#0E5A8A" stroke-width="1.5"/>

    <!-- Inner scene: Research & Wildlife -->
    <!-- Acacia tree & Giraffe silhouette -->
    <path d="M42 66 L42 50 Q42 45 46 44 L40 44 Q35 44 36 46 Q33 45 31 47 Q33 50 38 50 L38 66 Z" fill="#1E6B38"/>
    
    <!-- Giraffe silhouette standing tall -->
    <g transform="translate(48, 28) scale(0.65)">
      <path d="M12 4 L14 1 L16 3 L15 10 L13 22 L16 34 L18 55 L15 55 L13 36 L10 55 L7 55 L9 35 L7 24 C5 22, 4 18, 5 12 Z" fill="#9C6B18"/>
      <!-- Giraffe ears/horns -->
      <line x1="13" y1="2" x2="13" y2="0" stroke="#9C6B18" stroke-width="1.5"/>
      <line x1="15" y1="2" x2="16" y2="0" stroke="#9C6B18" stroke-width="1.5"/>
    </g>

    <!-- Scientific Migration compass / latitude rings -->
    <ellipse cx="55" cy="62" rx="28" ry="8" fill="none" stroke="#0E5A8A" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- TAWIRI Banner -->
    <rect x="20" y="78" width="70" height="17" rx="3.5" fill="url(#tawiriBlue)" stroke="#C08240" stroke-width="1.2"/>
    <text x="55" y="91" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="2">TAWIRI</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(126, 16)">
    <text x="0" y="20" fill="#124322" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" letter-spacing="1">TAWIRI TANZANIA</text>
    <text x="0" y="36" fill="#0E5A8A" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2">WILDLIFE RESEARCH INSTITUTE</text>
    
    <line x1="0" y1="45" x2="185" y2="45" stroke="#C08240" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="60" fill="#333333" font-family="Arial, sans-serif" font-size="9" font-weight="700">APEX WILDLIFE SCIENCE &amp; CENSUS BODY</text>
    <text x="0" y="73" fill="#666666" font-family="Arial, sans-serif" font-size="8.5" font-weight="500">Biodiversity &amp; Migration Corridor Science</text>
    <text x="0" y="85" fill="#1E6B38" font-family="Arial, sans-serif" font-size="8.5" font-weight="700">Official Conservation Research Partner</text>
  </g>
</svg>
