<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ncaaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9C6B18"/>
    </linearGradient>
    <linearGradient id="ncaaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F6"/>
      <stop offset="100%" stop-color="#C5DDE2"/>
    </linearGradient>
  </defs>

  <!-- Left: NCAA Official Shield Crest -->
  <g transform="translate(10, 6)">
    <!-- Outer Shield Frame -->
    <path d="M55 4 C85 4, 102 16, 102 46 C102 82, 55 106, 55 106 C55 106, 8 82, 8 46 C8 16, 25 4, 55 4 Z" fill="#2E4A35" stroke="url(#ncaaGold)" stroke-width="3.5"/>
    <path d="M55 10 C80 10, 95 20, 95 46 C95 76, 55 98, 55 98 C55 98, 15 76, 15 46 C15 20, 30 10, 55 10 Z" fill="url(#ncaaSky)"/>

    <!-- Caldera Rim Mountain backdrop -->
    <path d="M15 50 Q35 34 55 42 Q75 34 95 50 L95 62 Q55 60 15 62 Z" fill="#4B382A"/>
    <!-- Lake Magadi (Caldera soda lake) -->
    <ellipse cx="55" cy="57" rx="28" ry="4.5" fill="#A4D4E6"/>

    <!-- Acacia silhouette -->
    <path d="M78 58 L77 48 Q82 46 84 43 Q80 42 75 44 L75 58 Z" fill="#2E4A35"/>

    <!-- Maasai Shield (Center) -->
    <g transform="translate(42, 38) scale(0.6)">
      <!-- Crossed Spears -->
      <line x1="-12" y1="-12" x2="52" y2="52" stroke="#6D533A" stroke-width="3"/>
      <line x1="52" y1="-12" x2="-12" y2="52" stroke="#6D533A" stroke-width="3"/>
      
      <!-- Oval Maasai Shield -->
      <ellipse cx="20" cy="20" rx="14" ry="24" fill="#A83226" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Shield traditional patterns -->
      <line x1="20" y1="-4" x2="20" y2="44" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M20 5 Q10 20 20 35" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M20 5 Q30 20 20 35" fill="none" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Black Rhino Silhouette -->
    <g transform="translate(20, 66) scale(0.65)">
      <!-- Rhino body -->
      <path d="M6 14 C12 10, 26 8, 36 12 C44 14, 48 10, 52 14 C56 16, 58 14, 59 12 C59 14, 57 16, 55 17 L54 18 C56 18, 59 19, 58 20 C55 22, 50 22, 46 22 L44 28 L39 28 L40 22 L24 22 L22 28 L17 28 L18 20 C14 20, 10 18, 6 14 Z" fill="#202A24"/>
      <!-- Horn -->
      <path d="M56 13 L58 8 L54 12 Z" fill="#E5A93C"/>
    </g>

    <!-- NCAA Banner on Bottom -->
    <rect x="22" y="82" width="66" height="15" rx="3" fill="#1C3524" stroke="#E5A93C" stroke-width="1.2"/>
    <text x="55" y="93.5" fill="#FFD700" font-family="'Playfair Display', serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="2">NCAA</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(125, 18)">
    <text x="0" y="20" fill="#2E4A35" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" letter-spacing="0.5">NGORONGORO</text>
    <text x="0" y="38" fill="#1A2D20" font-family="'Playfair Display', serif, Georgia" font-size="13" font-weight="800" letter-spacing="1">CONSERVATION AREA</text>
    
    <line x1="0" y1="46" x2="185" y2="46" stroke="#DE6826" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="60" fill="#DE6826" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">UNESCO WORLD HERITAGE SITE</text>
    <text x="0" y="73" fill="#444" font-family="Arial, sans-serif" font-size="9" font-weight="600">Multiple Land Use &amp; Wildlife Sanctuary</text>
    <text x="0" y="85" fill="#777" font-family="Arial, sans-serif" font-size="8" font-weight="500">Government Statutory Authority</text>
  </g>
</svg>
