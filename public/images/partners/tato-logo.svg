<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tatoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3D6E"/>
      <stop offset="100%" stop-color="#062241"/>
    </linearGradient>
    <linearGradient id="tatoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#DE6826"/>
    </linearGradient>
  </defs>

  <!-- Left: TATO Official Circular Seal -->
  <g transform="translate(10, 6)">
    <!-- Outer Blue & Gold Circle -->
    <circle cx="55" cy="55" r="51" fill="url(#tatoBlue)" stroke="#DE6826" stroke-width="3.5"/>
    <circle cx="55" cy="55" r="45" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 2"/>

    <!-- Inner Circle with sky and scene -->
    <circle cx="55" cy="55" r="38" fill="#F8F9FA"/>
    
    <!-- Kilimanjaro Peak -->
    <polygon points="30,55 55,30 80,55" fill="#5A6B7C"/>
    <polygon points="50,30 55,30 60,30 62,35 55,38 48,35" fill="#FFFFFF"/>

    <!-- Safari Land Cruiser Silhouette (TATO signature) -->
    <g transform="translate(32, 48) scale(0.7)">
      <!-- 4x4 Body with Pop-up Roof -->
      <path d="M4 18 L10 18 L14 10 L38 10 L44 18 L58 18 L58 28 L4 28 Z" fill="#DE6826"/>
      <!-- Pop-up open safari roof -->
      <rect x="18" y="5" width="20" height="3" fill="#0E3D6E"/>
      <line x1="20" y1="5" x2="20" y2="10" stroke="#0E3D6E" stroke-width="1.5"/>
      <line x1="36" y1="5" x2="36" y2="10" stroke="#0E3D6E" stroke-width="1.5"/>
      <!-- Wheels -->
      <circle cx="16" cy="28" r="6" fill="#1A1A1A"/>
      <circle cx="16" cy="28" r="2.5" fill="#C0C0C0"/>
      <circle cx="46" cy="28" r="6" fill="#1A1A1A"/>
      <circle cx="46" cy="28" r="2.5" fill="#C0C0C0"/>
      <!-- Windows -->
      <rect x="16" y="12" width="10" height="5" fill="#FFFFFF" opacity="0.8"/>
      <rect x="28" y="12" width="10" height="5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Bottom TATO banner -->
    <rect x="24" y="77" width="62" height="18" rx="4" fill="url(#tatoOrange)" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="55" y="90" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">TATO</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(126, 16)">
    <text x="0" y="20" fill="#0E3D6E" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" letter-spacing="1">TATO TANZANIA</text>
    <text x="0" y="36" fill="#DE6826" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5">ASSOCIATION OF TOUR OPERATORS</text>
    
    <line x1="0" y1="45" x2="185" y2="45" stroke="#0E3D6E" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="60" fill="#222222" font-family="Arial, sans-serif" font-size="9.5" font-weight="700">ARUSHA HEADQUARTERS • EST. 1983</text>
    <text x="0" y="73" fill="#555555" font-family="Arial, sans-serif" font-size="8.5" font-weight="600">Peak Industry Body for Licensed Operators</text>
    <text x="0" y="85" fill="#0E8C26" font-family="Arial, sans-serif" font-size="8.5" font-weight="800">✓ Ethical Safari Standard Certified</text>
  </g>
</svg>
