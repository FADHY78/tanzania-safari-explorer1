<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="amrefRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D2A"/>
      <stop offset="100%" stop-color="#B30F19"/>
    </linearGradient>
  </defs>

  <!-- Left: Official AMREF Flying Doctors Emblem -->
  <g transform="translate(10, 6)">
    <!-- Red Outer Ring -->
    <circle cx="55" cy="55" r="50" fill="url(#amrefRed)" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="55" cy="55" r="44" fill="#FFFFFF"/>

    <!-- Winged Aeromedical Cross & Flying Plane -->
    <g transform="translate(55, 52)">
      <!-- Red Cross -->
      <path d="M-10 -30 L10 -30 L10 -10 L30 -10 L30 10 L10 10 L10 30 L-10 30 L-10 10 L-30 10 L-30 -10 L-10 -10 Z" fill="#E11D2A"/>
      
      <!-- Aeroplane Silhouette in Center (Fixed-Wing Bush Air Ambulance) -->
      <!-- Fuselage -->
      <ellipse cx="0" cy="0" rx="4" ry="18" fill="#FFFFFF"/>
      <!-- Wings -->
      <polygon points="0,-4 32,8 30,12 0,2 -30,12 -32,8 0,-4" fill="#FFFFFF"/>
      <!-- Tailplane -->
      <polygon points="0,12 12,18 10,20 0,16 -10,20 -12,18 0,12" fill="#FFFFFF"/>
      <!-- Propeller center -->
      <circle cx="0" cy="-17" r="2.5" fill="#FFD100"/>
    </g>

    <!-- Bottom Red Banner -->
    <rect x="18" y="79" width="74" height="17" rx="3.5" fill="url(#amrefRed)" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="55" y="91.5" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1.5">AMREF</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(126, 16)">
    <text x="0" y="22" fill="#E11D2A" font-family="'Playfair Display', serif, Georgia" font-size="24" font-weight="900" letter-spacing="0.5">AMREF</text>
    <text x="0" y="40" fill="#222222" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">FLYING DOCTORS</text>
    
    <line x1="0" y1="48" x2="185" y2="48" stroke="#E11D2A" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="62" fill="#E11D2A" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.2">24/7 AIR AMBULANCE COVERAGE</text>
    <text x="0" y="75" fill="#444444" font-family="Arial, sans-serif" font-size="8.5" font-weight="600">Bush Emergency Medical Evacuation</text>
    <text x="0" y="87" fill="#1EB53A" font-family="Arial, sans-serif" font-size="8.5" font-weight="800">✓ Included for All Embuat Safaris Guests</text>
  </g>
</svg>
