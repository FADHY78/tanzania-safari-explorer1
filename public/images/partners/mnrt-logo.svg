<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <linearGradient id="mnrtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#D48B28"/>
    </linearGradient>
    <linearGradient id="tzFlagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1EB53A"/>
      <stop offset="35%" stop-color="#1EB53A"/>
      <stop offset="38%" stop-color="#FFD100"/>
      <stop offset="45%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="62%" stop-color="#FFD100"/>
      <stop offset="65%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#00A3E0"/>
    </linearGradient>
  </defs>

  <!-- Left: Official Coat of Arms of Tanzania Heraldry -->
  <g transform="translate(10, 6)">
    <!-- Elephant Tusks flanking shield -->
    <path d="M16 100 C10 60, 20 20, 48 10 C35 25, 26 55, 30 100 Z" fill="#F4EDE1" stroke="#D48B28" stroke-width="1.2"/>
    <path d="M94 100 C100 60, 90 20, 62 10 C75 25, 84 55, 80 100 Z" fill="#F4EDE1" stroke="#D48B28" stroke-width="1.2"/>

    <!-- Central National Shield -->
    <path d="M55 12 C75 12, 85 24, 85 48 C85 76, 55 96, 55 96 C55 96, 25 76, 25 48 C25 24, 35 12, 55 12 Z" fill="#FFD100" stroke="#000000" stroke-width="1.5"/>

    <!-- Shield Section 1: Uhuru Torch (Kilimanjaro freedom torch) -->
    <path d="M35 15 Q55 12 75 15 L78 30 Q55 28 32 30 Z" fill="#FFD100"/>
    <!-- Flame -->
    <path d="M55 16 Q52 21 55 25 Q58 21 55 16 Z" fill="#E11D2A"/>

    <!-- Shield Section 2: National Flag -->
    <path d="M30 30 L80 30 L84 50 L26 50 Z" fill="url(#tzFlagGrad)"/>

    <!-- Shield Section 3: Red ground with crossed axe & hoe -->
    <path d="M26 50 L84 50 L82 70 L28 70 Z" fill="#B83226"/>
    <!-- Crossed Axe & Hoe -->
    <line x1="42" y1="54" x2="68" y2="66" stroke="#FFD100" stroke-width="2"/>
    <line x1="68" y1="54" x2="42" y2="66" stroke="#FFD100" stroke-width="2"/>

    <!-- Shield Section 4: Blue/White Waves (Indian Ocean & Lakes) -->
    <path d="M28 70 L82 70 Q55 94 55 94 Q28 70 28 70 Z" fill="#00A3E0"/>
    <path d="M34 76 Q55 86 76 76" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M40 82 Q55 90 70 82" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- National Motto Banner: UHURU NA UMOJA -->
    <rect x="12" y="96" width="86" height="15" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="55" y="107" fill="#000000" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1">UHURU NA UMOJA</text>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(126, 16)">
    <text x="0" y="20" fill="#0A3B2A" font-family="'Playfair Display', serif, Georgia" font-size="19" font-weight="900" letter-spacing="0.5">MINISTRY OF NATURAL</text>
    <text x="0" y="37" fill="#0A3B2A" font-family="'Playfair Display', serif, Georgia" font-size="17" font-weight="800" letter-spacing="0.5">RESOURCES &amp; TOURISM</text>
    
    <line x1="0" y1="46" x2="185" y2="46" stroke="#1EB53A" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="0" y="60" fill="#00A3E0" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.5">UNITED REPUBLIC OF TANZANIA</text>
    <text x="0" y="73" fill="#555555" font-family="Arial, sans-serif" font-size="8.5" font-weight="600">Governing Body of Tourism &amp; Wildlife</text>
    <text x="0" y="85" fill="#777777" font-family="Arial, sans-serif" font-size="8" font-weight="500">Statutory Licensing &amp; Regulatory Authority</text>
  </g>
</svg>
